<!DOCTYPE html>
<html>
<head>
    <title>Credit Approval System</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #FACC15, #F97316);
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            margin: 50px auto;
            width: 450px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1E293B;
        }

        p {
            color: gray;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px;
            background: #22C55E;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Credit Card Approval</h1>
    <p>Enter your details to check eligibility</p>

    <form action="/predict" method="post">

        <select name="Gender">
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select>

        <input type="number" name="Age" placeholder="Age" required>
        <input type="number" step="any" name="Debt" placeholder="Debt">

        <select name="Married">
            <option value="1">Married</option>
            <option value="0">Single</option>
        </select>

        <select name="BankCustomer">
            <option value="1">Bank Customer</option>
            <option value="0">Not a Customer</option>
        </select>

        <input type="number" name="EducationLevel" placeholder="Education Level">
        <input type="number" name="Ethnicity" placeholder="Category (1-5)">
        <input type="number" step="any" name="YearsEmployed" placeholder="Years Employed">

        <select name="PriorDefault">
            <option value="1">Had Default</option>
            <option value="0">No Default</option>
        </select>

        <select name="Employed">
            <option value="1">Employed</option>
            <option value="0">Unemployed</option>
        </select>

        <input type="number" name="CreditScore" placeholder="Credit Score">

        <select name="DriversLicense">
            <option value="1">Has License</option>
            <option value="0">No License</option>
        </select>

        <select name="Citizen">
            <option value="1">Citizen</option>
            <option value="0">Non-Citizen</option>
        </select>

        <input type="number" name="ZipCode" placeholder="Zip Code">
        <input type="number" name="Income" placeholder="Income">

        <br><br>
        <button type="submit">Check Approval</button>

    </form>
</div>

</body>
</html>

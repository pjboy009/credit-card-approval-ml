<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #22C55E, #FACC15);
            text-align: center;
        }

        .card {
            background: white;
            margin: 100px auto;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        .approved {
            color: green;
        }

        .rejected {
            color: red;
        }

        .btn {
            padding: 10px 20px;
            background: #F97316;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 class="{{ 'approved' if 'Approved' in result else 'rejected' }}">
        {{ result }}
    </h2>

    <h3>Chance: {{ chance }}%</h3>

    <h4>Top Factors:</h4>
    <ul>
        {% for r in reasons %}
            <li>{{ r }}</li>
        {% endfor %}
    </ul>

    <br>
    <a href="/" class="btn">Try Again</a>

</div>

</body>
</html>
